# Builds the Lean project and the leanblueprint, then publishes the result
# two ways:
#
#   * GitHub Pages: the rendered blueprint is deployed to
#     https://mario-ullrich.github.io/Lean-SNumbers/ with the PDF at
#     https://mario-ullrich.github.io/Lean-SNumbers/blueprint.pdf. The deploy
#     job runs for the public repository; its condition keeps a private fork
#     from deploying (Pages is unavailable on the free plan for private
#     repositories).
#
#   * Workflow artifact (always): `blueprint-YYYYMMDD` is downloadable from
#     every run summary under the Actions tab. It contains the PDF and the
#     web pages.

name: Build blueprint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # GitHub-hosted runners start with roughly 20 GB free on `/`, and both
      # `~/.elan` and the workspace live there. A Lean toolchain, the Mathlib
      # oleans and TeX Live together do not fit next to the preinstalled
      # language toolchains, so drop the ones this project never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      # Exact key only, no `restore-keys`: on a Mathlib bump the fallback would
      # restore the *previous* toolchain and olean set, and the new ones would
      # then have to fit alongside them.
      - name: Cache Lean toolchain and Lake artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: ${{ runner.os }}-lean-${{ hashFiles('lake-manifest.json') }}

      # ----- Lean side: build the project so that the declaration check can
      # verify each `\lean{Decl}` tag against the actually-existing declaration.
      - name: Install elan (Lean version manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Use the Mathlib revision pinned in lake-manifest.json (do NOT run
      # `lake update`: that pulls bleeding-edge Mathlib, making CI builds
      # non-reproducible and breaking them whenever Mathlib changes upstream).
      - name: Download Mathlib cache (pinned by lake-manifest.json)
        run: lake exe cache get || true

      - name: Build the Lean project
        run: lake build

      # The Palomar submission surfaces sit outside `defaultTargets`, so build
      # them explicitly. They ride along in this workflow because the step above
      # already builds the whole project for the declaration check, with elan
      # installed and the Mathlib cache warm; a separate workflow would repeat
      # that setup for a thirty-second build. This is what catches a Challenge
      # module broken by a later Mathlib bump, which would otherwise surface only
      # at submission time. The `sorry` warnings from the Challenge modules are
      # required by the submission format and do not fail the build.
      - name: Build the Palomar submission surfaces
        run: lake build Palomar

      # ----- Blueprint side: TeX, graphviz, leanblueprint
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install TeX Live and graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            latexmk dvisvgm graphviz libgraphviz-dev

      - name: Install leanblueprint
        run: |
          python -m pip install --upgrade pip
          pip install leanblueprint

      - name: Build blueprint PDF
        run: leanblueprint pdf
        continue-on-error: true   # PDF is nice-to-have; don't break the build if TeX hiccups

      - name: Build blueprint web
        run: leanblueprint web

      # plastexdepgraph writes the nodes and edges of the dependency graph in an
      # order that changes from run to run, and Graphviz then draws the same
      # blueprint differently in some builds. The script sorts them, so that
      # the layout below gives the same picture in every build.
      - name: Sort the dependency graph
        run: python blueprint/scripts/sort_dep_graph.py

      # Tidy the dependency graph. plastexdepgraph exposes no options for
      # this, so we post-process the generated page:
      #   * Recolor the "ready to formalize" nodes from blue (#A3D6FF) to white,
      #     so the graph reads two-tone: green = proof formalized, white = the
      #     statement is formalized (green border) but the proof is still a `sorry`.
      #   * Drop the legend rows that never apply here: "Orange border" and
      #     "Blue border" (every statement is formalized, so no node has either)
      #     and "Blue background" (now recolored white; the green-border row
      #     already explains a stated-but-unproved node).
      #   * Draw every edge solid. plastexdepgraph dashes the edges that come
      #     from a `\uses` inside a statement; here these say only that a
      #     statement uses a definition, so one kind of arrow suffices.
      #   * Head the page with the project title, "s-Numbers: Dependencies".
      #   * Reorient the graph left-to-right (rankdir=LR): base results on the
      #     left, derived results on the right. plastexdepgraph sets no rankdir,
      #     so we inject one right after the "digraph ... {" opening brace.
      - name: Tidy dependency graph (recolor sorry-nodes white, drop unused legend rows, draw all edges solid, title the page, lay out left-to-right)
        run: |
          sed -i 's/#A3D6FF/#FFFFFF/g; /<dt>Orange border<\/dt>/d; /<dt>Blue border<\/dt>/d; /<dt>Blue background<\/dt>/d; s/\[style=dashed\]//g; s/<h1 id="doc_title">Dependencies<\/h1>/<h1 id="doc_title">s-Numbers: Dependencies<\/h1>/; s/\(digraph[^{]*{\)/\1 rankdir="LR";/' blueprint/web/dep_graph_document.html

      # Zoom the graph, not the page: d3's zoom ignores ctrl+wheel, which is how
      # a touchpad pinch arrives, so the browser zoomed the whole page and with
      # it the statement that opens on a click. The script also lets the graph
      # zoom in further than d3-graphviz's default of ten times the fitted size.
      - name: Let the dependency graph take pinch and ctrl+wheel zoom
        run: python blueprint/scripts/dep_graph_zoom.py

      # Make the title page reachable from every page and the repository from
      # the title page. The menu of each chapter page gains a first entry
      # "Home" that leads to index.html, as the dependency graph page already
      # has, followed by the entry for the dependency graph, which
      # leanblueprint puts at the end; the title page gains a link to the
      # GitHub repository below the author. plasTeX renders neither: `\home`
      # and `\github` in web.tex only feed other templates.
      - name: Link the title page from every page and the repository from it
        run: |
          sed -i '/^<li ><a href="dep_graph_document.html">Dependency graph<\/a><\/li>$/d; s#<ul class="sub-toc-0">#&\n<li ><a href="index.html">Home</a></li>\n<li ><a href="dep_graph_document.html">Dependency graph</a></li>#' blueprint/web/*.html
          sed -i 's#<span class="author">Mario Ullrich</span>#&</p>\n<p class="repo-link">GitHub: <a href="https://github.com/mario-ullrich/Lean-SNumbers">Lean-SNumbers</a>#' blueprint/web/index.html

      # Point the `\lean{...}` links at this repository. leanblueprint builds
      # them as `{dochome}/find/#doc/Decl` and, with no `\dochome` set, falls
      # back to Mathlib's documentation site, where none of this project's
      # declarations exist. That URL shape is fixed inside the plugin, so the
      # links are rewritten here into permalinks at the commit being built.
      # The script fails the build if a cited declaration cannot be located, or
      # if it finds no links at all -- which is how an upstream template change
      # would show up.
      - name: Link Lean declarations to their sources
        run: |
          python blueprint/scripts/link_lean_decls.py \
            --repo "$GITHUB_REPOSITORY" \
            --rev "$GITHUB_SHA"

      # Fatal on purpose: a blueprint that cites a declaration the project no
      # longer has is wrong, and a step that only reports can itself break
      # unnoticed. The script performs the check of `leanblueprint checkdecls`
      # inside Lean itself; its docstring says why the `checkdecls` executable
      # cannot be used.
      - name: Verify Lean declaration references
        run: python blueprint/scripts/check_lean_decls.py

      # Bundle the PDF with the web artifact, so one download has both.
      - name: Include the PDF in the web bundle
        run: |
          if [ -f blueprint/print/print.pdf ]; then
            cp blueprint/print/print.pdf blueprint/web/blueprint.pdf
          fi

      # ----- Upload as a workflow artifact (downloadable from the run page).
      # The artifact contains the PDF and the web pages.
      - name: Name the artifact after the build date
        id: stamp
        run: echo "name=blueprint-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload blueprint (HTML site with blueprint.pdf)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stamp.outputs.name }}
          path: blueprint/web/
          retention-days: 30

      # Same directory again, packaged in the special format deploy-pages
      # expects (upload-artifact ZIPs are not compatible with Pages).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: blueprint/web

  # ----- Deploy the rendered blueprint to GitHub Pages on every push to main
  # (or a manual workflow_dispatch run); the condition keeps a private fork
  # from deploying. configure-pages enables Pages with source "GitHub
  # Actions" automatically on the first run.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable and configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
