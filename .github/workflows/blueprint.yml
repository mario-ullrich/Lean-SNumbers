# Builds the leanblueprint and stores the result as a workflow artifact.
#
# This variant is for *private* repositories where GitHub Pages is not
# available on the free plan. Instead of publishing the blueprint to a
# public URL, we save it as a downloadable ZIP attached to each workflow
# run. To view the blueprint:
#
#   1. Go to the repository's Actions tab.
#   2. Click on the most recent successful run of this workflow.
#   3. Scroll to the bottom and download the `blueprint-web` artifact.
#   4. Unzip it on your computer and open `index.html` in your browser.
#
# The PDF is uploaded as a separate artifact `blueprint-pdf` for
# convenience.

name: Build blueprint

on:
  push:
    branches: [main]
  workflow_dispatch:

# All pinned action versions below natively target Node.js 24. This env
# var is kept as a belt-and-suspenders guard against any future action
# added at a Node 20 version, ahead of the June 2026 deprecation cutoff.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache Lean toolchain and Lake artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: ${{ runner.os }}-lean-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-

      # ----- Lean side: build the project so that checkdecls can verify
      # each `\lean{Decl}` tag against the actually-existing declaration.
      - name: Install elan (Lean version manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Use the Mathlib revision pinned in lake-manifest.json (do NOT run
      # `lake update`: that pulls bleeding-edge Mathlib, making CI builds
      # non-reproducible and breaking them whenever Mathlib changes upstream).
      - name: Download Mathlib cache (pinned by lake-manifest.json)
        run: lake exe cache get || true

      - name: Build the Lean project
        run: lake build

      # ----- Blueprint side: TeX, graphviz, leanblueprint
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install TeX Live and graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            latexmk dvisvgm graphviz libgraphviz-dev

      - name: Install leanblueprint
        run: |
          python -m pip install --upgrade pip
          pip install leanblueprint

      - name: Build blueprint PDF
        run: leanblueprint pdf
        continue-on-error: true   # PDF is nice-to-have; don't break the build if TeX hiccups

      - name: Build blueprint web
        run: leanblueprint web

      # Tidy the dependency graph. plastexdepgraph exposes no options for
      # this, so we post-process the generated page: drop the two legend rows
      # that never occur here. Every statement in the project is formalized, so
      # no node has an orange or blue *border*; the only blue is the blue
      # *background* (proof stated but not yet formalized — the results still on
      # a `sorry`), whose legend row we keep.
      - name: Tidy dependency graph (drop unused legend rows)
        run: |
          sed -i '/<dt>Orange border<\/dt>/d; /<dt>Blue border<\/dt>/d' blueprint/web/dep_graph_document.html

      # Narrow the (top-to-bottom) dependency graph: it fans out wide because many
      # independent chains share the top ranks. graphviz's `unflatten` staggers leaf
      # nodes onto earlier ranks to add rows and cut width. The dot is embedded in the
      # page's renderDot(`…`) call, so we extract it, pipe through unflatten, re-inject.
      # Caveat: unflatten adds chaining edges that DO render, so a few arrows are
      # layout-only, not genuine dependencies. continue-on-error keeps any mishap from
      # breaking the build.
      - name: Narrow dependency graph (unflatten)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re, subprocess, pathlib
          p = pathlib.Path('blueprint/web/dep_graph_document.html')
          s = p.read_text(encoding='utf-8')
          m = re.search(r'renderDot\(`(.*?)`\)', s, re.S)
          if m:
              r = subprocess.run(['unflatten', '-f', '-l', '4', '-c', '6'],
                                  input=m.group(1), capture_output=True, text=True)
              if r.returncode == 0 and r.stdout.strip():
                  p.write_text(s[:m.start(1)] + r.stdout + s[m.end(1):], encoding='utf-8')
                  print('unflatten applied')
              else:
                  print('unflatten skipped:', r.returncode, r.stderr[:200])
          PY

      - name: Verify Lean declaration references
        run: leanblueprint checkdecls
        continue-on-error: true   # Don't block on first run; flip to false once stable.

      # ----- Upload as workflow artifacts
      - name: Upload blueprint web (HTML site)
        uses: actions/upload-artifact@v5
        with:
          name: blueprint-web
          path: blueprint/web/
          retention-days: 30

      - name: Upload blueprint PDF
        uses: actions/upload-artifact@v5
        if: hashFiles('blueprint/print/print.pdf') != ''
        with:
          name: blueprint-pdf
          path: blueprint/print/print.pdf
          retention-days: 30
