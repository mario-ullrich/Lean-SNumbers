# Builds the Lean project and the leanblueprint, and stores the results as
# downloadable workflow artifacts. To read the blueprint:
#
#   1. Go to the repository's Actions tab.
#   2. Open the most recent successful run of this workflow.
#   3. Download the `blueprint-web` artifact from the run summary.
#   4. Unzip it and open `index.html` (the PDF is bundled as blueprint.pdf).
#
# The PDF is uploaded separately as `blueprint-pdf` as well.

name: Build blueprint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# All pinned action versions below natively target Node.js 24. This env
# var is kept as a belt-and-suspenders guard against any future action
# added at a Node 20 version, ahead of the June 2026 deprecation cutoff.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache Lean toolchain and Lake artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            .lake/packages
            .lake/build
          key: ${{ runner.os }}-lean-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-

      # ----- Lean side: build the project so that checkdecls can verify
      # each `\lean{Decl}` tag against the actually-existing declaration.
      - name: Install elan (Lean version manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Use the Mathlib revision pinned in lake-manifest.json (do NOT run
      # `lake update`: that pulls bleeding-edge Mathlib, making CI builds
      # non-reproducible and breaking them whenever Mathlib changes upstream).
      - name: Download Mathlib cache (pinned by lake-manifest.json)
        run: lake exe cache get || true

      - name: Build the Lean project
        run: lake build

      # ----- Blueprint side: TeX, graphviz, leanblueprint
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install TeX Live and graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            latexmk dvisvgm graphviz libgraphviz-dev

      - name: Install leanblueprint
        run: |
          python -m pip install --upgrade pip
          pip install leanblueprint

      - name: Build blueprint PDF
        run: leanblueprint pdf
        continue-on-error: true   # PDF is nice-to-have; don't break the build if TeX hiccups

      - name: Build blueprint web
        run: leanblueprint web

      # Tidy the dependency graph. plastexdepgraph exposes no options for
      # this, so we post-process the generated page:
      #   * Recolor the "ready to formalize" nodes from blue (#A3D6FF) to white,
      #     so the graph reads two-tone: green = proof formalized, white = the
      #     statement is formalized (green border) but the proof is still a `sorry`.
      #   * Drop the legend rows that never apply here: "Orange border" and
      #     "Blue border" (every statement is formalized, so no node has either)
      #     and "Blue background" (now recolored white; the green-border row
      #     already explains a stated-but-unproved node).
      #   * Reorient the graph left-to-right (rankdir=LR): base results on the
      #     left, derived results on the right. plastexdepgraph sets no rankdir,
      #     so we inject one right after the "digraph ... {" opening brace.
      - name: Tidy dependency graph (recolor sorry-nodes white, drop unused legend rows, lay out left-to-right)
        run: |
          sed -i 's/#A3D6FF/#FFFFFF/g; /<dt>Orange border<\/dt>/d; /<dt>Blue border<\/dt>/d; /<dt>Blue background<\/dt>/d; s/\(digraph[^{]*{\)/\1 rankdir="LR";/' blueprint/web/dep_graph_document.html

      - name: Verify Lean declaration references
        run: leanblueprint checkdecls
        continue-on-error: true   # Reported, but not treated as a build failure.

      # Bundle the PDF with the web artifact, so one download has both.
      - name: Include the PDF in the web bundle
        run: |
          if [ -f blueprint/print/print.pdf ]; then
            cp blueprint/print/print.pdf blueprint/web/blueprint.pdf
          fi

      # ----- Upload as workflow artifacts (downloadable from the run page)
      - name: Upload blueprint web (HTML site)
        uses: actions/upload-artifact@v5
        with:
          name: blueprint-web
          path: blueprint/web/
          retention-days: 30

      - name: Upload blueprint PDF
        uses: actions/upload-artifact@v5
        if: hashFiles('blueprint/print/print.pdf') != ''
        with:
          name: blueprint-pdf
          path: blueprint/print/print.pdf
          retention-days: 30
