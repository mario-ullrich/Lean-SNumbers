name = "snumbers"
defaultTargets = ["SNumbers", "BasicResults", "AddOns"]

# Pin Mathlib to the v4.35.0 release tag (matches lean-toolchain).
# A tagged release is a stable point with a fully-published build cache, so
# `lake exe cache get` finds every olean, unlike a bleeding-edge `master`
# commit, whose cache is still being uploaded and downloads incomplete.
[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.35.0"

[[lean_lib]]
name = "SNumbers"

[[lean_lib]]
name = "BasicResults"

[[lean_lib]]
name = "AddOns"

# Submission surfaces for the Palomar registry, one directory per registered result.
# Kept out of `defaultTargets` on purpose: a plain `lake build` then behaves exactly as
# before and never compiles the Challenge modules, whose `sorry` placeholders are required
# by the submission format. Build them explicitly with `lake build Palomar`.
#
# The globs make every module under `Palomar/` its own root. A Challenge and its Solution
# must not meet in one environment: the Challenge repeats the definitions that the Solution
# gets from `SNumbers`, so importing both would declare them twice, and Comparator
# likewise compiles the two separately.
#
# `Palomar` is listed alongside `Palomar.+` because the `.+` form builds the submodules
# only, while `blueprint/scripts/check_lean_decls.py` imports the root module of every
# `lean_lib`. The root imports nothing, so loading it alongside the other libraries stays
# harmless.
[[lean_lib]]
name = "Palomar"
globs = ["Palomar", "Palomar.+"]
