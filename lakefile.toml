name = "snumbers"
defaultTargets = ["SNumbers", "BasicResults", "AddOns"]

# Pin Mathlib to the v4.33.0 release tag (matches lean-toolchain).
# A tagged release is a stable point with a fully-published build cache, so
# `lake exe cache get` finds every olean — unlike a bleeding-edge `master`
# commit, whose cache is still being uploaded and downloads incomplete.
[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.33.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "SNumbers"

[[lean_lib]]
name = "BasicResults"

[[lean_lib]]
name = "AddOns"

# Submission surfaces for the Palomar registry, in two libraries. Both are kept
# out of `defaultTargets` on purpose: a plain `lake build` then behaves exactly
# as before and never compiles the Challenge modules, whose `sorry` placeholders
# are required by the submission format. Build them explicitly with
# `lake build PalomarChallenges PalomarSolutions`.
#
# The split into two libraries with *distinct root components* is required, not
# cosmetic. A Challenge and its Solution must not meet in one environment — the
# Challenge repeats the definitions that the Solution gets from `SNumbers`, so
# importing both would declare them twice. Beyond that, Lean resolves a module by
# its root component, and Comparator puts the isolated Challenge directory first
# on its search path; a Solution sharing the root component with its Challenge is
# then looked for in the Challenge-only directory and not found
# (PalomarSubmission issue 108).
#
# Each root is listed alongside its `.+` form on purpose: the `.+` form builds
# the submodules only, and `leanblueprint checkdecls` imports the *root* module
# of every `lean_lib`, so a missing root olean breaks it. Both roots import
# nothing, so loading them alongside the other libraries stays harmless.
[[lean_lib]]
name = "PalomarChallenges"
globs = ["PalomarChallenges", "PalomarChallenges.+"]

[[lean_lib]]
name = "PalomarSolutions"
globs = ["PalomarSolutions", "PalomarSolutions.+"]
